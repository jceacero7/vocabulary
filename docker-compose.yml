

services:
  app:
    container_name: vocabulary-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=vocabulary_db
    depends_on:
      - db
    networks:
      - vocabulary-network

  db:
    container_name: vocabulary-db
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=vocabulary_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Inicializa la base de datos automáticamente al crear el contenedor
      - ./init-database.sql:/docker-entrypoint-initdb.d/init-database.sql
    networks:
      - vocabulary-network

volumes:
  db_data:

networks:
  vocabulary-network:
    driver: bridge
